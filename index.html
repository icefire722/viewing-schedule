<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>看房時段協調表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');
  :root {
    --blueprint-deep: #0B2238;
    --blueprint: #15324C;
    --paper: #FBF9F4;
    --paper-alt: #F1EEE5;
    --line: #E2DFD4;
    --ink: #1C2B33;
    --ink-soft: #5C6B72;
    --conflict: #D6493F;
    --conflict-bg: #FCE9E7;
    --ok: #2E8B7E;
    --ok-bg: #E6F2EF;
    --gold: #C99A3B;
    --busy: #8C95A3;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); -webkit-text-size-adjust: 100%; }
  .app-shell { max-width: 760px; margin: 0 auto; min-height: 100vh; background: var(--paper); }
  .header {
    background-color: var(--blueprint-deep);
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 22px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 1px, transparent 1px 22px);
    padding: 26px 20px 20px; color: #fff;
  }
  .header-title { font-family: var(--font-display); font-size: 23px; font-weight: 700; letter-spacing: .3px; margin: 0; }
  .header-sub { font-family: var(--font-body); font-size: 13px; color: #BFD3E3; margin-top: 6px; line-height: 1.5; }
  .identity-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-family: var(--font-mono); font-size: 12px; color: #CFE0EC; }
  .identity-bar button { background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; font-family: var(--font-mono); font-size: 11px; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  .identity-bar button:hover { background: rgba(255,255,255,0.1); }
  .header-stats { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .stat-chip { font-family: var(--font-mono); font-size: 12px; padding: 5px 10px; border-radius: 4px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #E7EEF3; }
  .stat-chip.warn { color: #FFD9D5; border-color: rgba(214,73,63,0.55); background: rgba(214,73,63,0.22); }
  .stat-chip.ok { color: #CFEDE5; border-color: rgba(46,139,126,0.5); background: rgba(46,139,126,0.18); }
  .tabs { display: flex; background: var(--paper-alt); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .tab-btn { flex: 1; padding: 14px 6px; background: none; border: none; font-family: var(--font-display); font-weight: 600; font-size: 13px; color: var(--ink-soft); cursor: pointer; border-bottom: 3px solid transparent; }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--gold); }
  .panel { padding: 20px 18px 60px; display: none; }
  .panel.active { display: block; }
  .field { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  .field label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .field input, .field textarea { font-family: var(--font-body); font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); width: 100%; }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--blueprint); outline-offset: 0; }
  .row-2 { display: flex; gap: 12px; }
  .row-2 .field { flex: 1; }
  @media (max-width:480px){ .row-2 { flex-direction: column; gap: 16px; } .header-title { font-size: 20px; } }
  .btn { padding: 13px; background: var(--blueprint-deep); color: #fff; border: none; border-radius: 6px; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .2px; cursor: pointer; width: 100%; }
  .btn:hover { background: var(--blueprint); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-outline { background: none; border: 1px solid var(--line); color: var(--ink); }
  .btn-outline:hover { border-color: var(--blueprint); color: var(--blueprint); }
  .btn-small { width: auto; padding: 8px 14px; font-size: 13px; }
  .form-error { color: var(--conflict); font-size: 13px; margin-top: -4px; margin-bottom: 14px; line-height: 1.5; }
  .gate-wrap { padding: 24px 18px 60px; display: flex; flex-direction: column; gap: 16px; }
  .role-card { border: 1px solid var(--line); border-radius: 8px; padding: 18px; background: #fff; }
  .role-card h2 { font-family: var(--font-display); font-size: 16px; margin: 0 0 12px; }
  .role-card .field { margin-bottom: 12px; }
  .overview-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 10px; flex-wrap: wrap; }
  .date-group { margin-bottom: 26px; }
  .date-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .date-label { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .date-count { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); }
  .timeline { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 10px 6px; margin-bottom: 10px; }
  .ruler-ticks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); margin-bottom: 6px; }
  .timeline-row { position: relative; height: 32px; margin-bottom: 5px; }
  .slot-bar { position: absolute; top: 1px; bottom: 1px; border-radius: 5px; font-family: var(--font-mono); font-size: 11px; color: #fff; display: flex; align-items: center; padding: 0 6px; overflow: hidden; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .slot-bar.conflict { outline: 2px dashed var(--conflict); outline-offset: 1px; }
  .busy-bar { position: absolute; top: 1px; bottom: 1px; border-radius: 5px; font-family: var(--font-mono); font-size: 11px; color: #fff; display: flex; align-items: center; padding: 0 6px; overflow: hidden; white-space: nowrap; background: var(--busy); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.18) 0 6px, transparent 6px 12px); }
  .slot-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .slot-item:last-child { border-bottom: none; }
  .slot-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .slot-info { flex: 1; min-width: 0; }
  .slot-time { font-family: var(--font-mono); font-weight: 600; font-size: 13px; }
  .slot-agent { font-family: var(--font-body); font-weight: 600; font-size: 14px; margin-top: 1px; }
  .slot-note { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .conflict-tag { display: inline-block; font-family: var(--font-mono); font-size: 11px; background: var(--conflict-bg); color: var(--conflict); padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
  .delete-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 12px; font-family: var(--font-body); padding: 4px; }
  .delete-btn:hover { color: var(--conflict); }
  .confirm-row { display: flex; gap: 10px; align-items: center; font-size: 12px; }
  .confirm-yes { color: var(--conflict); font-weight: 600; cursor: pointer; }
  .confirm-no { color: var(--ink-soft); cursor: pointer; }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-soft); font-size: 14px; line-height: 1.7; }
  .loading-state { text-align: center; padding: 50px 20px; color: var(--ink-soft); font-family: var(--font-mono); font-size: 13px; }
  .note-box { background: var(--paper-alt); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-size: 13px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 16px; }
  .note-box b { color: var(--ink); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--blueprint-deep); color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 50; max-width: 88%; text-align: center; }
  .toast.error { background: var(--conflict); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .checkbox-row label { font-size: 13px; color: var(--ink); }
</style>
</head>
<body>
<div class="app-shell" id="appShell"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const ADMIN_PASSCODE = 'davidadmin';
  const BUFFER_MINUTES = 60;
  const KEY_BUSY = 'busy-blocks';
  const KEY_SLOT_PREFIX = 'slots:';
  const KEY_SETTINGS = 'admin-settings';
  const AGENT_PALETTE = ['#2E86AB','#C97B3D','#6B5B95','#3E8E7E','#B5495B','#4C6E91','#0F8B8D','#9C6644'];
  const WEEKDAYS = ['日','一','二','三','四','五','六'];

  let identity = null;
  let activeTab = '';
  let deleteConfirmId = null;
  let pollHandle = null;
  let notifiedConflictKeys = new Set();

  function toMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
  function genId(){ return 's_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
  function slugify(s){ return String(s).trim().replace(/[\s\/\\'"]+/g,'_').slice(0,60); }
  function escapeHtml(str){ return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function formatDateLabel(dateStr){ const d = new Date(dateStr+'T00:00:00'); return (d.getMonth()+1)+'/'+d.getDate()+' (週'+WEEKDAYS[d.getDay()]+')'; }
  function agentColor(key){ let h=0; for(const ch of key){ h=(h*31+ch.charCodeAt(0))%99991; } return AGENT_PALETTE[h % AGENT_PALETTE.length]; }

  function hasConflict(dateA, startA, endA, dateB, startB, endB){
    if (dateA !== dateB) return false;
    const aS=toMinutes(startA), aE=toMinutes(endA), bS=toMinutes(startB), bE=toMinutes(endB);
    return aS < bE + BUFFER_MINUTES && bS < aE + BUFFER_MINUTES;
  }

  function showToast(msg, type){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type==='error' ? ' error' : '');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>{ t.className='toast'; }, 2400);
  }

  async function getJSON(key, shared, fallback){
    try{
      const res = localStorage.getItem(key);
      return res ? JSON.parse(res) : fallback;
    }catch(e){ return fallback; }
